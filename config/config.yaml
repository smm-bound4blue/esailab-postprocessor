# config/config.yaml
# eSAILab R&D project configuration. Edit this file when the physical
# geometry changes between test campaigns.

esail:
  span: 12.0      # meters
  chord: 2.714    # meters

app:
  title: "eSAILab CFD Post-Processor"
  theme: "dark"

pipeline:
  n_avg: 100        # iterations averaged for convergence stats (mean/std)
  rho: 1.20       # air density, kg/m^3
  fan_duct_diameter: 1.25   # meters, used to estimate fan dynamic pressure when
                              # no direct monitor is present
